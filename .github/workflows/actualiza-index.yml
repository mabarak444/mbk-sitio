name: Actualiza index temporal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reemplaza index.html con el archivo nuevo
        run: |
          set -e
          ls -l mbk-sitio-index.html index.html
          test "$(stat -c%s mbk-sitio-index.html)" = "11080759"
          cp mbk-sitio-index.html index.html
          test "$(stat -c%s index.html)" = "11080759"
          rm mbk-sitio-index.html
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Actualiza sitio: logo nuevo proyectos mbk"
          git push
