name: Replace index.html with new site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with the new site file
        run: |
          cp mbk-sitio-index.html index.html
          rm mbk-sitio-index.html
          rm .github/workflows/update-index.yml
          git config user.name "mabarak444"
          git config user.email "mabarak444@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Actualiza sitio proyectos mbk"
          git push
